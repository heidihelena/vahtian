name: publish
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write          # OIDC trusted publishing — no API token stored
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pipx run build
      - uses: pypa/gh-action-pypi-publish@release/v1
