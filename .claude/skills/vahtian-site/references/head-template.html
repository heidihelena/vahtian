<!-- ============================================================================
  Vahtian <head> template — copy into every new page and fill every {{slot}}.
  Mirrors the strongest existing pages (citevahti/, studyvahti/). Do not omit a
  block "to save space" — completeness here is what prevents meta drift.

  Placeholders:
    {{TITLE}}        e.g. "ReviewVahti — screening reliability (in your browser)"
    {{DESC}}         1–2 sentences, plain, honest, ≤160 chars ideal. No overclaiming.
    {{PATH}}         absolute path with trailing slash, e.g. "/reviewvahti/"
    {{CARD}}         social card filename in /brand/cards/, e.g. "reviewvahti-card.png"
                     (fallback: "vahtian-card.png" until a bespoke card exists)
    {{OG_ALT}}       alt text for the card image
    {{SCHEMA_TYPE}}  "SoftwareApplication" (tools) | "WebPage" | "AboutPage"
    {{ACCENT}}       favicon bracket colour, hex without '#': tool's accent
    {{GLYPH}}        inner favicon glyph paths (lilac %23C5B8E8), tool-specific

  NOTE: for early-access / not-yet-public tools, ADD <meta name="robots"
  content="noindex"> AND keep the page OUT of sitemap.xml. OG/twitter tags are
  still fine on noindex pages (they drive link previews, not indexing).
============================================================================= -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#2D2440">
<link rel="canonical" href="https://vahtian.com{{PATH}}">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vahtian.com{{PATH}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="https://vahtian.com/brand/cards/{{CARD}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Vahtian.com — Your future reviewer has questions. Good. Show your work.">
<meta property="og:site_name" content="Vahtian">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"{{SCHEMA_TYPE}}",
  "name":"{{TITLE}}",
  "url":"https://vahtian.com{{PATH}}",
  "description":"{{DESC}}",
  "applicationCategory":"Research software",
  "operatingSystem":"Any (web browser)",
  "offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},
  "license":"https://www.apache.org/licenses/LICENSE-2.0",
  "publisher":{"@type":"Organization","name":"Vahtian","url":"https://vahtian.com/"}
}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232D2440'/%3E%3Cg fill='none' stroke='%23{{ACCENT}}' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 9 H9 V23 H12'/%3E%3Cpath d='M20 9 H23 V23 H20'/%3E%3C/g%3E{{GLYPH}}%3C/svg%3E">
<link rel="stylesheet" href="/brand/footer.css">
