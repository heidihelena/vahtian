# Copy to the repo ROOT as .github/workflows/r-cmd-check.yaml
# CRAN-style check for the monorepo R package in packages/vahtian-r.
# r-lib/actions runs R CMD check via rcmdcheck; working-directory targets the subdir.
name: R-CMD-check

on:
  push:
    branches: [main]
    paths: ["packages/vahtian-r/**", ".github/workflows/r-cmd-check.yaml"]
  pull_request:
    paths: ["packages/vahtian-r/**", ".github/workflows/r-cmd-check.yaml"]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: packages/vahtian-r

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/vahtian-r
          error-on: '"note"'        # CRAN bar: fail on any error/warning/NOTE (0/0/0)
          upload-snapshots: true
