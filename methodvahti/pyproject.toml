[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "methodvahti"
version = "0.4.0"
description = "MethodVahti — qualitative heterogeneity scoring for sample size optimisation (EpiNet toolkit / Vahtian)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vahtian", email = "hello@vahtian.com" }]
keywords = ["qualitative", "research", "heterogeneity", "sample-size", "COREQ", "SRQR", "methods"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://vahtian.com/methodvahti"
Repository = "https://github.com/heidihelena/epinet"

[project.optional-dependencies]
pdf = ["reportlab>=4"]
test = ["pytest>=7", "reportlab>=4"]

[tool.setuptools]
py-modules = ["methodvahti_pdf"]

[tool.setuptools.package-data]
methodvahti = ["assets/fonts/*.ttf", "assets/fonts/LICENSE-OFL.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["methodvahti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
