<!doctype html>
<html lang="en">
<head>

  <style>
    :root{
      --navy:#2D2440; --violet:#8B6FC9; --lilac:#C5B8E8;
      --ink:#1c1830; --muted:#5b5570; --bg:#faf9fc; --line:#e7e3f0;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
    a{color:var(--violet)}
    .wrap{max-width:780px;margin:0 auto;padding:0 22px;width:100%}
    header{padding:30px 0 6px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.01em}
    .mark{width:32px;height:32px;flex:0 0 32px}
    main{flex:1;display:flex;align-items:center}
    .panel{padding:40px 0}
    .code{font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--violet);
          text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px}
    h1{font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
    .lede{font-size:clamp(17px,2.6vw,20px);color:#3a3450;margin:0 0 26px;max-width:54ch}
    .btn{display:inline-block;padding:11px 18px;border-radius:9px;font-weight:600;text-decoration:none;
         background:var(--navy);color:#fff;border:1px solid var(--navy)}
    .btn.ghost{background:transparent;color:var(--navy);border-color:var(--line);margin-left:8px}
    footer{padding:34px 0;border-top:1px solid var(--line)}
    footer p{color:var(--muted);font-size:13.5px;margin:0}
  </style>
</head>

  <div class="wrap">
    <header>

          <g fill="none" stroke="#8B6FC9" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">

  </div>

  <main>

      <a class="btn" href="/">Back to home</a>

    </div>

  <div class="wrap">
