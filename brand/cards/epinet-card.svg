    <radialGradient id="nodeG"><stop offset="0" stop-color="#C5B8E8" stop-opacity="0.5"/><stop offset="1" stop-color="#C5B8E8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- graph network motif, right -->
  <g stroke="#8273C0" stroke-width="1.6" opacity="0.55">
    <line x1="900" y1="170" x2="1010" y2="250"/><line x1="1010" y1="250" x2="960" y2="380"/>
    <line x1="960" y1="380" x2="840" y2="430"/><line x1="840" y1="430" x2="820" y2="300"/>
    <line x1="820" y1="300" x2="900" y2="170"/><line x1="820" y1="300" x2="960" y2="380"/>
    <line x1="1010" y1="250" x2="1090" y2="410"/><line x1="960" y1="380" x2="1090" y2="410"/>
  </g>
  <g>
    <circle cx="900" cy="170" r="26" fill="url(#nodeG)"/><circle cx="1010" cy="250" r="30" fill="url(#nodeG)"/>
    <circle cx="960" cy="380" r="34" fill="url(#nodeG)"/><circle cx="840" cy="430" r="24" fill="url(#nodeG)"/>
    <circle cx="820" cy="300" r="22" fill="url(#nodeG)"/><circle cx="1090" cy="410" r="20" fill="url(#nodeG)"/>
    <circle cx="900" cy="170" r="6.5" fill="#C5B8E8"/><circle cx="1010" cy="250" r="7.5" fill="#C5B8E8"/>
    <circle cx="960" cy="380" r="8.5" fill="#F5F2FB"/><circle cx="840" cy="430" r="6" fill="#C5B8E8"/>
    <circle cx="820" cy="300" r="5.5" fill="#C5B8E8"/><circle cx="1090" cy="410" r="5" fill="#C5B8E8"/>
