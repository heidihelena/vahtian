  <!-- left text -->
  <text x="70" y="120" font-size="40" font-weight="800" fill="#F5F2FB">EpiNet</text>
  <text x="72" y="196" font-size="16.5" font-weight="700" letter-spacing="3.5" fill="#B7A6E4" font-family="ui-monospace,Menlo,monospace">THE EPISTEMIC NETWORK TOOLKIT</text>
  <text x="68" y="292" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#F5F2FB">Honest evaluation,</text>
  <text x="68" y="358" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#F5F2FB">by default.</text>
  <text x="70" y="418" font-size="23" fill="#cfc6e6">Transparent graph &amp; feature-space analysis where the</text>
  <text x="70" y="450" font-size="23" fill="#cfc6e6">honesty checks travel with every run.</text>
  <rect x="70" y="486" width="78" height="4" rx="2" fill="#8B6FC9"/>
  <text x="70" y="548" font-size="16" font-weight="600" letter-spacing="2" fill="#9385b8" font-family="ui-monospace,Menlo,monospace">PYTHON · MIT · A VAHTIAN PROJECT</text>
