<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#150f28"/><stop offset="0.62" stop-color="#1d1630"/><stop offset="1" stop-color="#171127"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- check-status chips, right -->
  <g font-family="ui-monospace,Menlo,monospace" font-weight="700" font-size="27" letter-spacing="4" text-anchor="middle">
    <rect x="852" y="150" width="278" height="70" rx="13" fill="#123b33" stroke="#1E9E8A" stroke-width="1.6"/>
    <text x="991" y="195" fill="#5FD3B2">OK</text>
    <rect x="852" y="282" width="278" height="70" rx="13" fill="#3a1626" stroke="#C24D7E" stroke-width="1.6"/>
