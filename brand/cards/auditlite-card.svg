  <!-- left text -->
  <text x="70" y="120" font-size="40" font-weight="800" fill="#F5F2FB">AuditLite</text>
  <text x="72" y="196" font-size="16.5" font-weight="700" letter-spacing="3.5" fill="#A7B4E4" font-family="ui-monospace,Menlo,monospace">CHAIN-OF-CUSTODY FOR ANALYSES</text>
  <text x="68" y="292" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#F5F2FB">Can the analysis</text>
  <text x="68" y="356" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#F5F2FB">be reconstructed?</text>
  <text x="70" y="416" font-size="23" fill="#cfc6e6">Provenance, decisions, and runs in one hash-chained</text>
  <text x="70" y="448" font-size="23" fill="#cfc6e6">trail — with checks that flag what no longer follows.</text>
