# Tests for packages/vahtian-py (incl. the cross-language golden-hash parity gate).
name: python-tests

on:
  push:
    branches: [main]
    paths: ["packages/vahtian-py/**", ".github/workflows/python-tests.yml"]
  pull_request:
    paths: ["packages/vahtian-py/**", ".github/workflows/python-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install + test
        working-directory: packages/vahtian-py
        run: |
          pip install -e .
          pip install pytest
          pytest -q
