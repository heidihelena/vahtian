name: IndexNow submit

# Notify IndexNow (Bing, Yandex, and partners) when pages change, so the
# "last submitted" signal stays fresh. The key file already lives at the site
# root; this only POSTs URLs — no secrets required.
#
# - push to main: submits the pages that changed in the push.
# - manual run (Actions tab -> "Run workflow"): submits every URL in sitemap.xml
#   (use this to refresh everything on demand).

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '*.html'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      HOST: vahtian.com
      KEY: 478027c6e87c48dd85871fe255f51ad0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect URLs
        id: collect
        run: |
          set -euo pipefail
          base="https://${HOST}"
          : > urls.txt

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: submitting all URLs from sitemap.xml"
            grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g' >> urls.txt
          else
            before="${{ github.event.before }}"
            if git cat-file -e "${before}^{commit}" 2>/dev/null; then
              echo "Push: submitting pages changed in ${before}..${{ github.sha }}"
              git diff --name-only "${before}" "${{ github.sha }}" \
                | while IFS= read -r f; do
                    case "$f" in
                      index.html) echo "${base}/" ;;
                      */index.html) echo "${base}/${f%index.html}" ;;
                    esac
                  done >> urls.txt
            else
              echo "No valid previous commit; submitting all URLs from sitemap.xml"
              grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g' >> urls.txt
            fi
          fi

          # de-duplicate, drop blanks
          sort -u -o urls.txt urls.txt
          sed -i '/^$/d' urls.txt
          count=$(wc -l < urls.txt | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Collected ${count} URL(s):"
          cat urls.txt || true

      - name: Submit to IndexNow
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          payload=$(jq -Rn \
            --arg host "${HOST}" \
            --arg key "${KEY}" \
            --arg keyloc "https://${HOST}/${KEY}.txt" \
            '{host:$host, key:$key, keyLocation:$keyloc, urlList:[inputs]}' urls.txt)
          echo "Payload:"; echo "$payload" | jq .
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' --data "$payload")
          echo "IndexNow responded: HTTP ${code}"
          cat resp.txt || true
          # IndexNow returns 200 (accepted) or 202 (accepted, pending validation).
          case "$code" in
            200|202) echo "Submitted successfully." ;;
            *) echo "::error::IndexNow submission failed (HTTP ${code})"; exit 1 ;;
          esac
