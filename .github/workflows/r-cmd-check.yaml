# CRAN-style check for the monorepo R package in packages/vahtian-r.
# Runs R CMD check (incl. the testthat golden-hash parity test) via r-lib/actions.
name: R-CMD-check

on:
  push:
    branches: [main]
    paths: ["packages/vahtian-r/**", ".github/workflows/r-cmd-check.yaml"]
  pull_request:
    paths: ["packages/vahtian-r/**", ".github/workflows/r-cmd-check.yaml"]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: packages/vahtian-r
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/vahtian-r
          error-on: '"error"'        # start lenient; tighten to "note" for CRAN (0/0/0)
          upload-snapshots: true
